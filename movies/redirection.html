<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Human Verification</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            padding: 30px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f2f4f7;

            color: #222;

        }


        /* =====================================================
           TWO COLUMN LAYOUT
        ===================================================== */

        .two-column {

            width: 100%;

            max-width: 1500px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 40px;

            align-items: center;

        }


        /* =====================================================
           IMAGE CARD
        ===================================================== */

        .imgcard {

            width: 100%;

            overflow: hidden;

            background: #fff;

            border: 1px solid #e5e7eb;

            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

        }


        .imgcard:hover {

            transform: translateY(-6px);

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.13);

        }


        .imgcard img {

            display: block;

            width: 100%;

            aspect-ratio: 16 / 9;

            object-fit: cover;

        }


        .imgcard h1 {

            margin: 20px 20px 8px;

            color: #111827;

            font-size: 24px;

            line-height: 1.25;

        }


        .imgcard p {

            margin: 0 20px 22px;

            color: #6b7280;

            font-size: 15px;

            line-height: 1.7;

        }


        /* =====================================================
           CAPTCHA CARD
        ===================================================== */

        .card {

            width: 100%;

            max-width: 500px;

            margin: 0 auto;

            padding: 32px;

            background: #fff;

            border-radius: 16px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .card h1 {

            text-align: center;

            font-size: 24px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 24px;

        }


        /* =====================================================
           CAPTCHA ROW
        ===================================================== */

        .captcha-area {

            width: 100%;

            display: flex;

            gap: 8px;

            margin-bottom: 15px;

        }


        /* =====================================================
           CAPTCHA DISPLAY
        ===================================================== */

        .captcha {

            position: relative;

            flex: 1 1 auto;

            width: 0;

            min-width: 0;

            height: 75px;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            background:

                repeating-linear-gradient(
                    45deg,
                    #f0f0f0,
                    #f0f0f0 3px,
                    #e5e5e5 3px,
                    #e5e5e5 6px
                );

            border: 1px solid #ccc;

            border-radius: 8px;

            user-select: none;

        }


        /* =====================================================
           NOISE LINES
        ===================================================== */

        .captcha::before {

            content: "";

            position: absolute;

            width: 120%;

            height: 2px;

            top: 25px;

            left: -10%;

            background: #777;

            opacity: 0.55;

            transform: rotate(-8deg);

            pointer-events: none;

            z-index: 3;

        }


        .captcha::after {

            content: "";

            position: absolute;

            width: 120%;

            height: 2px;

            top: 48px;

            left: -10%;

            background: #777;

            opacity: 0.45;

            transform: rotate(7deg);

            pointer-events: none;

            z-index: 3;

        }


        /* =====================================================
           CAPTCHA CHARACTERS
        ===================================================== */

        .character {

            position: relative;

            z-index: 4;

            display: inline-block;

            flex: 0 0 auto;

            margin: 0 2px;

            font-size: 28px;

            font-weight: 800;

            line-height: 1;

            color: #222;

            text-shadow:
                1px 1px 0 #fff,
                -1px -1px 0 #aaa;

            transform:
                rotate(var(--rotation))
                translateY(var(--offset));

        }


        /* =====================================================
           REFRESH BUTTON
        ===================================================== */

        .refresh {

            flex: 0 0 55px;

            width: 55px;

            height: 75px;

            border: none;

            border-radius: 8px;

            background: #111;

            color: #fff;

            font-size: 24px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        .refresh:hover {

            background: #333;

        }


        .refresh:active {

            transform: scale(0.97);

        }


        .refresh:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        /* =====================================================
           INPUT
        ===================================================== */

        .captcha-input {

            display: block;

            width: 100%;

            height: 50px;

            padding: 0 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            outline: none;

            background: #fff;

            color: #222;

            font-size: 17px;

            letter-spacing: 2px;

            margin-bottom: 12px;

            text-transform: none;

        }


        .captcha-input:focus {

            border-color: #111;

        }


        .captcha-input:disabled {

            background: #f2f2f2;

            cursor: not-allowed;

        }


        /* =====================================================
           VERIFY BUTTON
        ===================================================== */

        .verify {

            display: block;

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 8px;

            background: #111;

            color: #fff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        .verify:hover {

            background: #333;

        }


        .verify:active {

            transform: scale(0.99);

        }


        .verify:disabled {

            background: #777;

            cursor: not-allowed;

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            min-height: 20px;

            margin-top: 12px;

            text-align: center;

            font-size: 14px;

            line-height: 20px;

        }


        .success {

            color: #15803d;

        }


        .error {

            color: #dc2626;

        }


        .warning {

            color: #d97706;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            body {

                padding: 20px;

            }


            .two-column {

                grid-template-columns: 1fr;

                gap: 25px;

            }


            .imgcard,
            .card {

                max-width: 600px;

                margin: 0 auto;

            }

        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 450px) {

            body {

                padding: 12px;

            }


            .two-column {

                gap: 18px;

            }


            .card {

                padding: 22px 16px;

                border-radius: 13px;

            }


            .imgcard {

                border-radius: 13px;

            }


            .imgcard h1 {

                margin: 16px 16px 7px;

                font-size: 20px;

            }


            .imgcard p {

                margin: 0 16px 18px;

                font-size: 13px;

            }


            .card h1 {

                font-size: 21px;

            }


            .character {

                font-size: 23px;

                margin: 0 1px;

            }


            .captcha {

                height: 65px;

            }


            .refresh {

                width: 50px;

                flex-basis: 50px;

                height: 65px;

            }

        }


        /* =====================================================
           VERY SMALL SCREEN
        ===================================================== */

        @media (max-width: 320px) {

            .card {

                padding: 18px 12px;

            }


            .character {

                font-size: 19px;

            }


            .refresh {

                width: 45px;

                flex-basis: 45px;

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN LAYOUT
    ===================================================== -->

    <main class="two-column">


        <!-- =================================================
             LEFT IMAGE CARD
        ================================================== -->

        <div class="imgcard">

            <img
                src="https://picsum.photos/800/500?random=23"
                alt="Banner"
            >

            <h1>
                This is Banner
            </h1>

            <p>
                This is description for the banner.
            </p>

        </div>


        <!-- =================================================
             RIGHT CAPTCHA CARD
        ================================================== -->

        <div class="card">


            <h1>
                Human Verification
            </h1>


            <p class="subtitle">

                Enter the characters exactly as shown below.
                CAPTCHA is case-sensitive.

            </p>


            <!-- CAPTCHA -->

            <div class="captcha-area">


                <div
                    class="captcha"
                    id="captcha"
                    aria-label="CAPTCHA"
                ></div>


                <button
                    type="button"
                    class="refresh"
                    id="refresh"
                    title="Generate new CAPTCHA"
                    aria-label="Generate new CAPTCHA"
                >
                    ↻
                </button>


            </div>


            <!-- INPUT -->

            <input
                type="text"
                id="captchaInput"
                class="captcha-input"
                placeholder="Enter CAPTCHA"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                maxlength="6"
            >


            <!-- VERIFY -->

            <button
                type="button"
                class="verify"
                id="verify"
            >
                Verify
            </button>


            <!-- MESSAGE -->

            <div
                class="message"
                id="message"
                aria-live="polite"
            ></div>


        </div>

    </main>


    <script>

        /* =====================================================
           CAPTCHA CONFIGURATION
        ===================================================== */

        const characters =
            "ABCDEFGHJKLMNPQRSTUVWXYZ" +
            "abcdefghijkmnpqrstuvwxyz" +
            "23456789";

        const CAPTCHA_LENGTH = 6;

        let captchaCode = "";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const captchaElement =
            document.getElementById("captcha");

        const captchaInput =
            document.getElementById("captchaInput");

        const messageElement =
            document.getElementById("message");

        const verifyButton =
            document.getElementById("verify");

        const refreshButton =
            document.getElementById("refresh");


        /* =====================================================
           GENERATE CAPTCHA
        ===================================================== */

        function generateCaptcha() {

            captchaCode = "";

            captchaElement.innerHTML = "";

            captchaInput.value = "";

            messageElement.textContent = "";

            messageElement.className = "message";


            for (
                let i = 0;
                i < CAPTCHA_LENGTH;
                i++
            ) {

                const randomIndex =
                    Math.floor(
                        Math.random() *
                        characters.length
                    );


                const character =
                    characters[randomIndex];


                captchaCode += character;


                const span =
                    document.createElement("span");


                span.className =
                    "character";


                span.textContent =
                    character;


                const rotation =
                    Math.floor(
                        Math.random() * 31
                    ) - 15;


                const offset =
                    Math.floor(
                        Math.random() * 11
                    ) - 5;


                span.style.setProperty(
                    "--rotation",
                    `${rotation}deg`
                );


                span.style.setProperty(
                    "--offset",
                    `${offset}px`
                );


                captchaElement.appendChild(span);

            }

        }


        /* =====================================================
           VERIFY CAPTCHA
        ===================================================== */

        function verifyCaptcha() {

            const userInput =
                captchaInput.value.trim();


            /* Empty */

            if (!userInput) {

                messageElement.textContent =
                    "Please enter the CAPTCHA.";

                messageElement.className =
                    "message warning";

                return;

            }


            /* Case-sensitive comparison */

            if (userInput === captchaCode) {

                messageElement.textContent =
                    "✓ Verification successful. Redirecting...";

                messageElement.className =
                    "message success";


                captchaInput.disabled = true;

                verifyButton.disabled = true;

                refreshButton.disabled = true;

                verifyButton.textContent =
                    "Verified ✓";


                /*
                   Redirect after successful verification.

                   CHANGE THIS URL.
                */

                setTimeout(function () {

                    window.location.href =
                        "https://brief25.github.io/Colon/";

                }, 1000);


                return;

            }


            /* Wrong CAPTCHA */

            messageElement.textContent =
                "✕ Incorrect CAPTCHA. Please try again.";

            messageElement.className =
                "message error";


            /*
               Generate a new CAPTCHA,
               but don't erase the error message.
            */

            captchaCode = "";

            captchaElement.innerHTML = "";


            setTimeout(function () {

                generateCaptcha();

            }, 700);

        }


        /* =====================================================
           EVENTS
        ===================================================== */

        verifyButton.addEventListener(
            "click",
            verifyCaptcha
        );


        refreshButton.addEventListener(
            "click",
            generateCaptcha
        );


        captchaInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    verifyCaptcha();

                }

            }
        );


        /* =====================================================
           INITIALIZE
        ===================================================== */

        generateCaptcha();

    </script>


</body>

</html>
